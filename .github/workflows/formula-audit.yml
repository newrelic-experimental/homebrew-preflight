name: Formula Audit

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: brew style Formula/preflight.rb
      - run: |
          brew tap newrelic-experimental/preflight "$GITHUB_WORKSPACE"
          brew trust newrelic-experimental/preflight
          brew audit --strict --online newrelic-experimental/preflight/preflight
      - run: brew install --build-from-source newrelic-experimental/preflight/preflight
      - run: brew test newrelic-experimental/preflight/preflight
